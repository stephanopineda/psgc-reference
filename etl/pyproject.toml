[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "psgc-etl"
version = "0.1.0"
description = "ETL pipeline for Philippine Standard Geographic Code publications"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["psgc_etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
